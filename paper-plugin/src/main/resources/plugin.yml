name: CosmicCompanionPaper
main: me.landon.papercompanion.CosmicCompanionPlugin
version: 1.0.0
api-version: '1.21'
authors: [Landon]
description: Paper bridge for CosmicPrisons Fabric companion mod
commands:
  companiondemo:
